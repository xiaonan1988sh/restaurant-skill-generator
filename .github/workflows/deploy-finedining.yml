name: Deploy finedining to COS

on:
  push:
    branches: [main]
    paths:
      - 'finedining/**'
      - '.github/workflows/deploy-finedining.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install coscmd
        run: pip install coscmd
      - name: Sync finedining/ to COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          coscmd config -a "$TENCENT_SECRET_ID" -s "$TENCENT_SECRET_KEY" -b mtxiaonan-1414473915 -r ap-shanghai
          coscmd upload -r finedining/ finedining/
